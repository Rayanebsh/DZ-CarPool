name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Linting
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort
    
    - name: Run Black
      run: black --check Backend/ || echo "Black formatting issues found"
      continue-on-error: true
    
    - name: Run Flake8
      run: flake8 Backend/ --max-line-length=100 --exclude=migrations,venv || echo "Flake8 issues found"
      continue-on-error: true
    
    - name: Run isort
      run: isort --check-only --profile black Backend/ || echo "Import sorting issues found"
      continue-on-error: true

  # Job 2: Tests (avec débogage complet)
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Backend/requirements.txt
        pip list
    
    - name: Create environment file
      run: |
        cat > Backend/.env << 'EOF'
        SECRET_KEY=test-secret-key-for-ci-pipeline-12345678
        DEBUG=True
        DJANGO_ENV=test
        DB_NAME=test_db
        DB_USER=postgres
        DB_PASSWORD=postgres
        DB_HOST=localhost
        DB_PORT=5432
        ALLOWED_HOSTS=localhost,127.0.0.1
        CORS_ALLOWED_ORIGINS=http://localhost:3000
        EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
        DEFAULT_FROM_EMAIL=test@dzcarpool.com
        GOOGLE_CLIENT_ID=test-client-id
        GOOGLE_CLIENT_SECRET=test-client-secret
        SMS_API_KEY=test-sms-key
        SMS_SENDER=DZCarPool
        USE_REDIS=False
        EOF
    
    - name: Create directories
      run: |
        mkdir -p Backend/logs
        mkdir -p Backend/media/documents
        mkdir -p Backend/staticfiles
    
    - name: Health check
      working-directory: Backend
      run: |
        echo "=== Django Check ==="
        python manage.py check --settings=config.settings
        
        echo "=== Test Database Connection ==="
        python -c "
        import psycopg2
        conn = psycopg2.connect(
            dbname='test_db',
            user='postgres',
            password='postgres',
            host='localhost',
            port=5432
        )
        print('✅ PostgreSQL connection successful')
        conn.close()
        "
        
        echo "=== Django Configuration ==="
        python manage.py diffsettings --settings=config.settings | head -n 20
    
    - name: Run migrations
      working-directory: Backend
      run: |
        python manage.py migrate --noinput --settings=config.settings --verbosity=2
    
    - name: Run tests with detailed output
      working-directory: Backend
      run: |
        python manage.py test app.users.tests \
          --settings=config.settings \
          --verbosity=2 \
          --keepdb \
          --failfast \
          2>&1 | tee test_output.log
      continue-on-error: true
    
    - name: Show error details on failure
      if: failure()
      working-directory: Backend
      run: |
        echo "=== Last 200 lines of test output ==="
        tail -n 200 test_output.log || true
        
        echo "=== Django logs ==="
        cat logs/*.log 2>/dev/null || echo "No logs found"
    
    - name: Run tests with coverage (if basic tests passed)
      if: success()
      working-directory: Backend
      run: |
        pip install coverage
        coverage run --source='app' manage.py test app.users.tests \
          --settings=config.settings \
          --verbosity=2
        coverage xml
        coverage html
        coverage report
    
    - name: Upload coverage
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./Backend/coverage.xml
        flags: unittests
        fail_ci_if_error: false
    
    - name: Archive test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          Backend/test_output.log
          Backend/logs/
          Backend/htmlcov/
      if: always()

  # Job 3: Security
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run Safety check
      run: safety check --json || true
      continue-on-error: true
    
    - name: Run Bandit
      run: bandit -r Backend/ -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
      if: always()

  # Job 4: Build Docker (optionnel)
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: Backend/
        push: false
        tags: dzcarpool:${{ github.sha }}
      continue-on-error: true