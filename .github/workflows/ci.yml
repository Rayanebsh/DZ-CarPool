name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '15'

jobs:
  # Job 1: Linting et formatage du code
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/Backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort
    
    - name: Run Black
      run: black --check Backend/
      continue-on-error: true
    
    - name: Run Flake8
      run: flake8 Backend/ --max-line-length=100 --exclude=migrations,venv
      continue-on-error: true
    
    - name: Run isort
      run: isort --check-only --profile black Backend/
      continue-on-error: true

  # Job 2: Tests unitaires et d'intégration
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/Backend/requirements.txt') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Backend/requirements.txt
        pip list  # Afficher les packages installés pour debug
    
    - name: Create .env file
      run: |
        cat > Backend/.env << EOF
        SECRET_KEY=test-secret-key-for-ci-pipeline-12345678
        DEBUG=False
        DJANGO_ENV=test
        DB_NAME=test_db
        DB_USER=postgres
        DB_PASSWORD=postgres
        DB_HOST=localhost
        DB_PORT=5432
        ALLOWED_HOSTS=localhost,127.0.0.1
        CORS_ALLOWED_ORIGINS=http://localhost:3000
        
        # Email settings (test mode)
        EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
        DEFAULT_FROM_EMAIL=test@dzcarpool.com
        
        # Google OAuth (dummy values for tests)
        GOOGLE_CLIENT_ID=test-client-id
        GOOGLE_CLIENT_SECRET=test-client-secret
        
        # SMS settings (dummy values for tests)
        SMS_API_KEY=test-sms-key
        SMS_SENDER=DZCarPool
        EOF

    - name: Create required directories
      run: |
        mkdir -p Backend/logs
        mkdir -p Backend/media/documents
        mkdir -p Backend/staticfiles
    
    - name: Run migrations
      working-directory: Backend
      run: python manage.py migrate --noinput
    
    - name: Run tests with coverage
      working-directory: Backend
      run: |
        python manage.py test app.users.tests --settings=config.settings.test --verbosity=2
    
    - name: Generate coverage report
      working-directory: Backend
      run: |
        coverage run --source='app.users' manage.py test app.users.tests --settings=config.settings.test
        coverage xml
        coverage html
        coverage report
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./Backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true
    
    - name: Archive coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: Backend/htmlcov/
      if: always()

  # Job 3: Security checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run Safety check
      run: safety check --json || true
      continue-on-error: true
    
    - name: Run Bandit
      run: bandit -r Backend/ -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
      if: always()

  # Job 4: Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
    
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: Backend/
        push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/dzcarpool:latest
          ${{ secrets.DOCKER_USERNAME }}/dzcarpool:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/dzcarpool:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/dzcarpool:buildcache,mode=max
      if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''

  # Job 5: Deploy to production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      run: |
        curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'
      if: secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != ''